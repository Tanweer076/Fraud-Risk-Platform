[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudapi"
version = "0.1.0"
description = "FastAPI backend for the Fraud Risk Platform"
requires-python = ">=3.11"
# fraudml is the sibling ml/ package: install both with `pip install -e ml -e backend`.
dependencies = [
    "fraudml",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.1",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.1",
    "bcrypt==5.0.0",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
    "limits==5.8.0",
    "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.8",
]

[project.scripts]
fraudapi = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection defaults are evaluated once by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Security"]

[tool.ruff.lint.isort]
# backend/alembic/ holds migrations; the import is the third-party package.
known-third-party = ["alembic"]
