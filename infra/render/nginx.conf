# infra/nginx/default.conf.template, adapted to run beside the API in one container on Render.
# start fills in ${PORT}. Everything nginx writes goes to /tmp: it runs as the app user.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Render's proxy appends the client it saw to X-Forwarded-For. Without real_ip_recursive
    # nginx takes that last entry, so a client cannot pick its own address by sending the header.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream api {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen ${PORT};
        server_name _;
        root /usr/share/nginx/html;

        gzip on;
        gzip_min_length 1024;
        gzip_types text/css application/javascript application/json image/svg+xml text/plain text/csv;

        include /etc/nginx/snippets/security-headers.conf;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 120s;
            client_max_body_size 64m;
        }

        location /assets/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location / {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }
}
