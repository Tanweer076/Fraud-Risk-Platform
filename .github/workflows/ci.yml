name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fraud
          POSTGRES_PASSWORD: fraud
          POSTGRES_DB: fraud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fraud:fraud@localhost:5432/fraud_test
      TEST_DATABASE_URL: postgresql+psycopg://fraud:fraud@localhost:5432/fraud_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ../ml -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: pytest -q
      - name: OpenAPI schema matches the frontend's copy
        run: |
          fraudapi openapi --output ../frontend/openapi.json
          git diff --exit-code -- ../frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match the OpenAPI schema
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
