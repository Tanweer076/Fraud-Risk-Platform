[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudml"
version = "0.1.0"
description = "Ingestion, labelling, features and models for the Fraud Risk Platform"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "httpx==0.28.1",
    "defusedxml==0.7.1",
    "numpy==2.4.6",
    "matplotlib==3.11.2",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "joblib==1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.8",
]

[project.scripts]
fraudml = "fraudml.pipeline:main"

[tool.setuptools.packages.find]
include = ["fraudml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
